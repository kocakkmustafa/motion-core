name: motion_entitlements
description: >-
  Domain-independent purchase/entitlement contracts for the Yula Motion
  family: store product refs, the unknown/loading/entitled/notEntitled/
  recoverableError purchase state machine, asynchronous store events,
  a local cache, a server verification interface with user/app scoped
  access, and the generic free-lesson rule (counts only). Holds no paywall
  design or hard-coded price.
version: 0.3.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: '>=3.35.0'

dependencies:
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3
  in_app_purchase_storekit: ^0.4.13
  supabase_flutter: 2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  in_app_purchase_platform_interface: ^1.4.1
  http: 1.6.0
