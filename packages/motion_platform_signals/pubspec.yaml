name: motion_platform_signals
description: >-
  Store/platform signals for the Yula Motion family: the App Store app
  transaction ID (StoreKit 2 AppTransaction, iOS 16+) for server-signed
  introductory-offer eligibility, and the store-shared age range (Apple
  Declared Age Range on iOS 26+, Google Play Age Signals 0.0.4). Every call
  degrades to null where the platform API is unavailable; callers keep their
  own fallback.
version: 0.3.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.yulalab.motion_platform_signals
        pluginClass: MotionPlatformSignalsPlugin
      ios:
        pluginClass: MotionPlatformSignalsPlugin
