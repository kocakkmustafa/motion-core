name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  app-specific-word-scan:
    name: App-özgü kelime taraması (core API sızıntı kapısı)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Süzgecin kendisi çalışıyor mu (negatif test)
        # Hiçbir şey bulmayan bir denetim ile bozuk bir denetim dışarıdan
        # aynı görünür — süzgeç önce kendi negatif testini geçmeli.
        run: python3 -m unittest tools/tests/test_scan_app_specific_words.py -v

      - name: packages/*/lib altında app-özgü kelime taraması
        # 02-MOTION-AILESI-ORKESTRASYON.md §7: app-özgü kelime veya content ID
        # core API'sine girmez. Yalnız gönderilen kod taranır (yorumlar hariç,
        # test/docs hariç) — bkz. tools/scan_app_specific_words.py başlık notu.
        run: python3 tools/scan_app_specific_words.py

      - name: Hasat yt-dlp güvenlik sözleşmesi (ağsız)
        run: |
          python3 tools/harvest_rig/tests/test_yt_dlp_safety.py
          python3 tools/harvest_rig/tests/test_harvest_path_safety.py

  dart-package:
    name: ${{ matrix.package }} (dart test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [motion_core, motion_content]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - run: dart pub get
      - run: dart analyze
      - run: dart test

  flutter-package:
    name: ${{ matrix.package }} (flutter test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - motion_camera
          - motion_feedback
          - motion_audio
          - motion_store
          - motion_entitlements
          - motion_account
          - motion_telemetry
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  motion-purchase-server:
    name: Motion account and purchase server (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7

      - name: Format and type-check Motion functions
        run: |
          deno fmt --check supabase/functions
          deno check supabase/functions/motion-verify-purchase/index.ts supabase/functions/motion-check-membership/index.ts supabase/functions/motion-delete-account/index.ts

      - name: Check account, product and provider boundaries
        run: deno test --allow-env supabase/functions/_shared/motion_purchase_claim_test.ts supabase/functions/_shared/motion_store_provider_test.ts supabase/functions/_shared/motion_review_access_test.ts
